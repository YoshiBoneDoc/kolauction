services:
  bot:
    build: .
    image: khub-bot:local
    container_name: khub-bot
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    volumes:
      - bot-state:/app/data
    healthcheck:
      test: ["CMD", "node", "src/health.mjs", "--check"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot-state:
