name: Deploy shared cache Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish an in-progress deployment before starting the latest queued push.
concurrency:
  group: khub-public-auction-cache-production
  cancel-in-progress: false

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test website API routing and cache privacy
        run: node --test tests/site-worker.test.mjs tests/shared-auction-cache.test.mjs
      # Validation only. The existing Cloudflare Git integration deploys the
      # website with its own public Supabase build variables.
      - name: Compile website Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/khub-site-dry-run"
        env:
          VITE_SHARED_AUCTION_CACHE: 'true'
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'

  deploy:
    needs: validate-site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # These checks use Node built-ins and do not need the website dependencies.
      - name: Check for private credentials
        run: node scripts/checkSecrets.mjs

      - name: Test public caching and privacy boundaries
        run: node --test tests/shared-auction-cache.test.mjs

      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy cache Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy --config workers/public-auction-cache/wrangler.jsonc --keep-vars
