<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" fill="none">
 <title>Half-open mystery raffle box</title>
 <defs>
  <linearGradient id="paper" x1="150" y1="220" x2="300" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f0e9ed"/></linearGradient>
  <linearGradient id="lining" x1="170" y1="100" x2="205" y2="235" gradientUnits="userSpaceOnUse"><stop stop-color="#332b38"/><stop offset="1" stop-color="#66503e"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#ffdc87" stop-opacity=".95"/><stop offset=".5" stop-color="#f5c365" stop-opacity=".5"/><stop offset="1" stop-color="#f5c365" stop-opacity="0"/></radialGradient>
  <linearGradient id="inside" x1="190" y1="185" x2="210" y2="248" gradientUnits="userSpaceOnUse"><stop stop-color="#d9ad58"/><stop offset="1" stop-color="#ffe9a2"/></linearGradient>
  <radialGradient id="radiantGold"><stop stop-color="#fff3b0" stop-opacity=".9"/><stop offset=".3" stop-color="#ffd34f" stop-opacity=".65"/><stop offset=".65" stop-color="#efad23" stop-opacity=".25"/><stop offset="1" stop-color="#efad23" stop-opacity="0"/></radialGradient>
  <linearGradient id="goldRays" x1="202" y1="215" x2="202" y2="65" gradientUnits="userSpaceOnUse"><stop stop-color="#fff2a6" stop-opacity=".7"/><stop offset=".5" stop-color="#ffd45c" stop-opacity=".24"/><stop offset="1" stop-color="#ffd45c" stop-opacity="0"/></linearGradient>
 </defs>
 <ellipse cx="206" cy="377" rx="163" ry="19" fill="#a17ab4" opacity=".16"/>
 <g stroke="#302637" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <!-- The open lid has one broad face, a narrow top edge and a side edge. -->
  <path d="m65 216-23-38L84 69l209-23 28 34-53 110Z" fill="url(#paper)"/>
  <path d="m84 69 28 34 209-23-28-34Z" fill="#fffefb"/>
  <path d="m42 178 23 38 47-113-28-34Z" fill="#eae3ef"/>
  <path d="m112 103 209-23-53 110-203 26Z" fill="#fffdf8"/>
  <path d="m126 119 170-20-44 83-168 23Z" fill="url(#lining)" stroke-width="3"/>
  <!-- Gold light sits inside the opening, with the front rim in front. -->
  <path d="m65 216 203-26 88 29-219 30Z" fill="url(#inside)"/>
 </g>
 <!-- Radiance rises from the opening; the original front rim stays above it. -->
 <ellipse cx="202" cy="170" rx="150" ry="123" fill="url(#radiantGold)"/>
 <path d="m177 215-69-133 41-16 48 145-9-156 38 3-12 153 65-145 35 27-88 124Z" fill="url(#goldRays)"/>
 <ellipse cx="202" cy="206" rx="109" ry="76" fill="url(#light)"/>
 <g stroke="#ffe7a3" stroke-width="5" stroke-linecap="round">
  <path d="m142 211-17-20m42 11-15-33m40 27-3-40m29 37 9-34m13 40 17-23"/>
 </g>
 <g stroke="#302637" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="m65 220 72 29-1 135-71-33Z" fill="#eee7ed"/>
  <path d="m137 249 219-30-1 133-219 32Z" fill="url(#paper)"/>
  <path d="m65 216 72 28 219-29v29l-219 32-72-29Z" fill="#fffdf8"/>
  <path d="m137 244-1 140"/>
  <path d="m218 234 49-7v47l-49 7Z" fill="#fffdf8"/>
  <path d="m239 246 10-1v12l-10 1Z" fill="#403343" stroke-width="3"/>
  <path d="m189 308v14c0 24 88 17 88-9v-17" fill="none" stroke-width="9"/>
  <path d="m91 278v39" stroke="#918392" stroke-width="6"/>
 </g>
 <g fill="#e8b958">
  <path d="M355 45c2 9 4 11 11 13-7 2-9 4-11 13-2-9-4-11-11-13 7-2 9-4 11-13Z"/>
  <path d="M22 120c2 10 4 12 12 14-8 2-10 4-12 14-2-10-4-12-12-14 8-2 10-4 12-14Z"/>
  <path d="M369 153c2 10 4 12 12 14-8 2-10 4-12 14-2-10-4-12-12-14 8-2 10-4 12-14Z"/>
 </g>
</svg>
